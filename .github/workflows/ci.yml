name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Authenticate private shared dependency
        env:
          TOKEN: ${{ secrets.BURNRATE_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/upld-internal/burnrate-spec.git".insteadOf ssh://git@github.com/upld-internal/burnrate-spec.git
      - name: Install stable and MSRV
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.85.0 --profile minimal
      - name: Packaging rejection tests
        run: python3 scripts/test-marketplace-package.py
      - name: Offline suites
        run: |
          cargo +stable fetch --locked
          cargo +stable fmt --all --check
          CARGO_NET_OFFLINE=true cargo +stable clippy --locked --all-targets -- -D warnings
          CARGO_NET_OFFLINE=true cargo +stable test --locked --all-targets
          CARGO_NET_OFFLINE=true cargo +1.85.0 test --locked --all-targets

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Authenticate private shared dependency
        shell: pwsh
        env:
          TOKEN: ${{ secrets.BURNRATE_TOKEN }}
        run: git config --global "url.https://x-access-token:$($env:TOKEN)@github.com/upld-internal/burnrate-spec.git.insteadOf" "ssh://git@github.com/upld-internal/burnrate-spec.git"
      - name: Install stable Rust
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Tests
        shell: pwsh
        run: |
          cargo +stable fetch --locked
          $env:CARGO_NET_OFFLINE = 'true'
          cargo +stable test --locked --all-targets
      - name: Native Credential Manager lifecycle
        shell: pwsh
        run: cargo +stable test --locked native_vault_rotation_and_missing -- --ignored
      - name: Build Windows x64 binary
        shell: pwsh
        run: cargo +stable build --locked --release --target x86_64-pc-windows-msvc
      - name: Plugin hook smoke test
        shell: pwsh
        run: ./scripts/windows-hook-smoke.ps1 -Binary target/x86_64-pc-windows-msvc/release/burnrate-copilot.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-x64-development-binary
          if-no-files-found: error
          retention-days: 7
          path: target/x86_64-pc-windows-msvc/release/burnrate-copilot.exe
