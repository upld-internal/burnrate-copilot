[package]
name = "burnrate-copilot"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
burnrate-adapter-kit = { git = "ssh://git@github.com/upld-internal/burnrate-spec.git", rev = "0c7c72c5ac52392e80bdad6729ac8624b18d2160" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "=0.4.1"
sha2 = "0.10"
base64 = "0.22"
rpassword = "=7.4.0"
zeroize = "1"
time = { version = "=0.3.36", features = ["formatting", "parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
strip = "symbols"
